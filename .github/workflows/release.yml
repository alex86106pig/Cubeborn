# 推送 v* tag 後：下載 Godot 與 Windows 匯出模板 → 跑自動檢查 → 匯出 Windows 版 → 壓成 zip → 建立 GitHub Release（附 zip）
# 給朋友連線試玩用（docs/連線試玩.md）。注意：一次推送超過 3 個 tag 時 GitHub 不會觸發，要到 Actions 頁面用 workflow_dispatch 手動跑
name: Release Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的 tag（例如 v0.34.0，必須已經推送）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Cache Godot and Windows export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates" /tmp/templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          # 只留 Windows 64 位元模板，快取比較小
          cp /tmp/templates/templates/version.txt /tmp/templates/templates/windows_*_x86_64*.exe "$templates/"

      - name: Import project and run checks
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          cd godot
          "$GODOT" --headless --import --path . || true
          "$GODOT" --headless --path . -s res://tests/check.gd

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          cd godot
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Windows Desktop" ../build/windows/Cubeborn.exe
          test -f ../build/windows/Cubeborn.exe

      - name: Package zip
        run: |
          cp docs/連線試玩.md build/windows/HOW-TO-PLAY-ONLINE.txt
          cd build/windows
          zip -q -9 "../Cubeborn-${TAG}-windows.zip" Cubeborn.exe HOW-TO-PLAY-ONLINE.txt
          ls -l ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          # 版本說明取 CHANGELOG.md 裡這一版的段落
          awk -v v="[$ver]" 'index($0, "## ") == 1 { p = index($0, v) > 0; next } p' CHANGELOG.md > /tmp/notes.md
          printf '\n---\n下載 zip、解壓後執行 Cubeborn.exe。和朋友連線的步驟見 zip 裡的 HOW-TO-PLAY-ONLINE.txt。\n' >> /tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "build/Cubeborn-${TAG}-windows.zip" --clobber
          else
            gh release create "$TAG" "build/Cubeborn-${TAG}-windows.zip" --title "Cubeborn $TAG" --notes-file /tmp/notes.md --verify-tag
          fi
