<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骰子圖示預覽</title>
<style>
  :root { --bg: #2a2119; --text: #efe4cc; --muted: #b8a58a; --gold: #e0b45a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .bar { position: fixed; left: 16px; top: 14px; right: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; pointer-events: none; }
  .bar h1 { font-size: 20px; margin: 0 12px 0 0; text-shadow: 0 2px 4px #000a; }
  .bar button { pointer-events: auto; background: #3a2e23; color: var(--text); border: 2px solid #8a6240; border-radius: 6px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .bar button.on { border-color: var(--gold); background: #5a4126; }
  .tip { position: fixed; left: 16px; bottom: 14px; color: var(--muted); font-size: 13px; text-shadow: 0 1px 3px #000; line-height: 1.6; }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <h1>骰子圖示預覽（劍盾）</h1>
  <button id="b65" class="on">遊戲視角 65°</button>
  <button id="bfree">自由轉</button>
  <button id="bspin">自動轉</button>
  <button id="bthrow">丟一次</button>
  <button id="bface"></button>
</div>
<div class="tip">拖曳旋轉、滾輪縮放。白色切角骰子，每面嵌一塊石板（圖直接切自 Gemini 那張 6 格圖）。<br>
面：上 旋風斬、前 盾撞、右 劍氣、後 盾震、左 開場護盾、下 傷害 +</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { ConvexGeometry } from "three/addons/geometries/ConvexGeometry.js";

const SRC = encodeURI("劍盾技能與效果icon.jpg");

// ---------- 從 6 格圖切出石板（自動找每格裡不是背景色的範圍）----------
const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = SRC; });
const W = img.naturalWidth, H = img.naturalHeight;
const full = document.createElement("canvas"); full.width = W; full.height = H;
const fctx = full.getContext("2d"); fctx.drawImage(img, 0, 0);
const data = fctx.getImageData(0, 0, W, H).data;
const bg = [data[0], data[1], data[2]];   // 左上角是背景（米黃）
const isBg = (x, y) => { const k = (y * W + x) * 4; return Math.abs(data[k] - bg[0]) + Math.abs(data[k + 1] - bg[1]) + Math.abs(data[k + 2] - bg[2]) < 60; };
function tileBox(cx, cy) {   // 第 cx 欄、第 cy 列那格裡石板的範圍
  const x0 = Math.floor(W * cx / 3), x1 = Math.floor(W * (cx + 1) / 3), y0 = Math.floor(H * cy / 2), y1 = Math.floor(H * (cy + 1) / 2);
  const midY = Math.floor((y0 + y1) / 2), midX = Math.floor((x0 + x1) / 2);
  let l = x0, r = x1 - 1, t = y0, b = y1 - 1;
  while (l < r && isBg(l, midY)) l++;
  while (r > l && isBg(r, midY)) r--;
  while (t < b && isBg(midX, t)) t++;
  while (b > t && isBg(midX, b)) b--;
  const s = Math.min(r - l, b - t), pad = Math.round(s * 0.01);   // 往內縮一點：邊緣的反鋸齒混著底色
  return { l: l + pad, t: t + pad, s: s - pad * 2 };
}
const TEX = 512;
function tileTexture(cx, cy) {
  const { l, t, s } = tileBox(cx, cy);
  const c = document.createElement("canvas"); c.width = c.height = TEX;
  c.getContext("2d").drawImage(full, l, t, s, s, 0, 0, TEX, TEX);
  return c;
}
const toTex = (c) => { const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; return tex; };

// ---------- 去背 + 刻痕 ----------
// 石板裡面是平的深褐色：取四個角附近（斜面內側）的顏色當背景色，跟它差不多的變透明；斜面（外圈 BEVEL）整圈去掉
const BEVEL = 0.075;
function cutout(src) {
  const c = document.createElement("canvas"); c.width = c.height = TEX;
  const g = c.getContext("2d"); g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, TEX, TEX), d = im.data;
  const samples = [];
  for (const [fx, fy] of [[0.11, 0.11], [0.89, 0.11], [0.11, 0.89], [0.89, 0.89], [0.5, 0.1], [0.1, 0.5]]) {
    const k = (Math.floor(fy * TEX) * TEX + Math.floor(fx * TEX)) * 4; samples.push([d[k], d[k + 1], d[k + 2]]);
  }
  const med = [0, 1, 2].map(i => samples.map(s => s[i]).sort((a, b) => a - b)[Math.floor(samples.length / 2)]);
  const lo = BEVEL * TEX, hi = (1 - BEVEL) * TEX;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const k = (y * TEX + x) * 4;
    const corner = 0.22 * TEX;   // 石板四個切角的斜面也去掉
    if (x < lo || x > hi || y < lo || y > hi || x + y < corner || (TEX - x) + y < corner || x + (TEX - y) < corner || (TEX - x) + (TEX - y) < corner) { d[k + 3] = 0; continue; }
    const dist = Math.hypot(d[k] - med[0], d[k + 1] - med[1], d[k + 2] - med[2]);
    const a = Math.min(1, Math.max(0, (dist - 16) / 34));
    if (a <= 0) { d[k + 3] = 0; continue; }
    // 半透明的邊：把混進去的背景色扣掉，不然會留一圈褐色毛邊
    for (let i = 0; i < 3; i++) d[k + i] = Math.min(255, Math.max(0, (d[k + i] - med[i] * (1 - a)) / a));
    // 太淺的（白色刀光）壓暗成淺灰藍：白骰面上才看得到
    const lum = 0.3 * d[k] + 0.59 * d[k + 1] + 0.11 * d[k + 2];
    if (lum > 150) { const t = Math.min(1, (lum - 150) / 105) * 0.42; d[k] *= 1 - t * 1.1; d[k + 1] *= 1 - t; d[k + 2] *= 1 - t * 0.7; }
    d[k + 3] = Math.round(a * 255);
  }
  g.putImageData(im, 0, 0);
  return c;
}
// 刻進白骰面：外圍一圈淡陰影（刻痕的邊）、凹槽裡左上緣暗（被邊擋住光）、右下緣亮
function engrave(icon) {
  const c = document.createElement("canvas"); c.width = c.height = TEX;
  const g = c.getContext("2d");
  const mask = (dx, dy, color) => {   // 圖的形狀（填單色）、平移 dx, dy
    const m = document.createElement("canvas"); m.width = m.height = TEX;
    const mg = m.getContext("2d"); mg.drawImage(icon, dx, dy);
    mg.globalCompositeOperation = "source-in"; mg.fillStyle = color; mg.fillRect(0, 0, TEX, TEX);
    return m;
  };
  const edge = (dx, dy, color) => {   // 圖裡面、平移後蓋不到的那一條邊
    const m = mask(0, 0, color), mg = m.getContext("2d");
    mg.globalCompositeOperation = "destination-out"; mg.drawImage(icon, dx, dy);
    return m;
  };
  for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-1.5, -1.5], [1.5, 1.5], [1.5, -1.5], [-1.5, 1.5]]) g.drawImage(mask(dx, dy, "rgba(60,50,45,0.22)"), 0, 0);
  g.drawImage(icon, 0, 0);
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = "rgba(0,0,0,0.10)"; g.fillRect(0, 0, TEX, TEX);   // 凹下去整體暗一點
  g.drawImage(edge(5, 5, "rgba(20,12,8,0.55)"), 0, 0);
  g.drawImage(edge(-3, -3, "rgba(255,255,255,0.45)"), 0, 0);
  return c;
}
// 圖的順序：上排 旋風斬、盾撞、劍氣；下排 盾震、開場護盾、傷害 +
const raw = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]].map(([x, y]) => tileTexture(x, y));
const tiles = raw.map(toTex);
const carved = raw.map(c => toTex(engrave(cutout(c))));

// ---------- 場景 ----------
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#2a2119");
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

scene.add(new THREE.HemisphereLight("#ffffff", "#6a5a50", 1.1));   // 光偏暖的話白骰子會被染成米色
const sun = new THREE.DirectionalLight("#fffaf2", 2.2);
sun.position.set(-3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(sun);

// 桌面：酒紅絨布（跟遊戲的骰盤一樣）
const felt = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: "#8e3434", roughness: 1 }));
felt.rotation.x = -Math.PI / 2;
felt.receiveShadow = true;
scene.add(felt);

// ---------- 骰子：白色切角方塊 ----------
const S = 0.5, C = 0.09;   // 半邊長、切角
const pts = [];
for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
  pts.push(new THREE.Vector3(sx * (S - C), sy * (S - C), sz * S));
  pts.push(new THREE.Vector3(sx * (S - C), sy * S, sz * (S - C)));
  pts.push(new THREE.Vector3(sx * S, sy * (S - C), sz * (S - C)));
}
const body = new THREE.Mesh(new ConvexGeometry(pts), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.5, flatShading: true }));
body.castShadow = true;
const die = new THREE.Group();
die.add(body);

// 每面一塊石板：八角形（跟圖裡的石板一樣切角），貼切出來的圖
const IN = 0.35;          // 石板半寬（面的平坦部分半寬 S - C = 0.41，留一圈白邊）
const CH = IN * 0.2;      // 石板切角：比圖裡的切角大一點，切掉角落的米黃底色
const shape = new THREE.Shape();
[[-IN + CH, -IN], [IN - CH, -IN], [IN, -IN + CH], [IN, IN - CH], [IN - CH, IN], [-IN + CH, IN], [-IN, IN - CH], [-IN, -IN + CH]]
  .forEach(([x, y], i) => i ? shape.lineTo(x, y) : shape.moveTo(x, y));
const plate = new THREE.ShapeGeometry(shape);
const uv = plate.attributes.uv, pos = plate.attributes.position;
for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + IN) / (2 * IN), (pos.getY(i) + IN) / (2 * IN));
// 面的方向：上 旋風斬、前(+Z) 盾撞、右(+X) 劍氣、後(-Z) 盾震、左(-X) 開場護盾、下 傷害 +
const faces = [
  [0, new THREE.Euler(-Math.PI / 2, 0, 0), new THREE.Vector3(0, 1, 0)],
  [1, new THREE.Euler(0, 0, 0), new THREE.Vector3(0, 0, 1)],
  [2, new THREE.Euler(0, Math.PI / 2, 0), new THREE.Vector3(1, 0, 0)],
  [3, new THREE.Euler(0, Math.PI, 0), new THREE.Vector3(0, 0, -1)],
  [4, new THREE.Euler(0, -Math.PI / 2, 0), new THREE.Vector3(-1, 0, 0)],
  [5, new THREE.Euler(Math.PI / 2, 0, 0), new THREE.Vector3(0, -1, 0)],
];
// 刻痕版：整個平坦面一張透明圖（圖比石板版大一點，因為沒有石板框）
const FLAT = (S - C) * 2 * 0.98;
const carvePlane = new THREE.PlaneGeometry(FLAT, FLAT);
const plateMeshes = [], carveMeshes = [];
for (const [k, rot, n] of faces) {
  const m = new THREE.Mesh(plate, new THREE.MeshStandardMaterial({ map: tiles[k], roughness: 0.7 }));
  m.rotation.copy(rot);
  m.position.copy(n).multiplyScalar(S + 0.002);
  die.add(m); plateMeshes.push(m);
  const e = new THREE.Mesh(carvePlane, new THREE.MeshStandardMaterial({ map: carved[k], transparent: true, alphaTest: 0.02, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -1 }));
  e.rotation.copy(rot);
  e.position.copy(n).multiplyScalar(S + 0.001);
  die.add(e); carveMeshes.push(e);
}
let carveMode = true;
function applyFaceMode() {
  plateMeshes.forEach(m => m.visible = !carveMode);
  carveMeshes.forEach(m => m.visible = carveMode);
  document.getElementById("bface").textContent = carveMode ? "面：刻痕（切換石板）" : "面：石板（切換刻痕）";
}
document.getElementById("bface").onclick = () => { carveMode = !carveMode; applyFaceMode(); };
applyFaceMode();
die.position.y = S;
scene.add(die);

// ---------- 鏡頭模式 ----------
const btn = { b65: document.getElementById("b65"), bfree: document.getElementById("bfree"), bspin: document.getElementById("bspin") };
let spin = false;
function gameView() {   // 遊戲擲骰時：俯角 65°、方位角 45°
  const el = 65 * Math.PI / 180, az = Math.PI / 4, d = 5;
  camera.position.set(Math.cos(el) * Math.sin(az) * d, 0.5 + Math.sin(el) * d, Math.cos(el) * Math.cos(az) * d);
  controls.target.set(0, 0.5, 0);
}
function setMode(m) {
  Object.values(btn).forEach(b => b.classList.remove("on"));
  btn[m].classList.add("on");
  spin = m === "bspin";
  if (m === "b65") gameView();
  if (m === "bfree") { camera.position.set(2.2, 2.0, 2.6); controls.target.set(0, 0.5, 0); }
}
btn.b65.onclick = () => setMode("b65");
btn.bfree.onclick = () => setMode("bfree");
btn.bspin.onclick = () => setMode("bspin");
gameView();

// 丟一次：隨機翻到某一面朝上（看圖轉了方向落地的樣子）
let throwT = -1, q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion();
const UP_ROT = [new THREE.Euler(0, 0, 0), new THREE.Euler(Math.PI / 2, 0, 0), new THREE.Euler(0, 0, Math.PI / 2), new THREE.Euler(-Math.PI / 2, 0, 0), new THREE.Euler(0, 0, -Math.PI / 2), new THREE.Euler(Math.PI, 0, 0)];
document.getElementById("bthrow").onclick = () => {
  q0.copy(die.quaternion);
  const e = UP_ROT[Math.floor(Math.random() * 6)];
  q1.setFromEuler(e).premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.floor(Math.random() * 4) * Math.PI / 2 + (Math.random() - 0.5) * 0.6));
  throwT = 0;
};

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (spin) die.rotation.y += dt * 0.6;
  if (throwT >= 0) {
    throwT = Math.min(1, throwT + dt / 0.9);
    const k = 1 - Math.pow(1 - throwT, 3);
    die.quaternion.slerpQuaternions(q0, q1, k);
    die.position.y = S + Math.sin(Math.PI * throwT) * 0.9;
    if (throwT >= 1) throwT = -1;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.__ready = true;
window.__die = die;   // 除錯：從主控台轉骰子看某一面
</script>
</body>
</html>
