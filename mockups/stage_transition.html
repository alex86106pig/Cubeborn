<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>換小關過場</title>
<style>
  :root { --bg: #111317; --card: #1b1e24; --text: #e6e3dc; --muted: #9a968c; --accent: #8fd0ff; --gold: #e0b45a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 8px; max-width: 900px; }
  .flow { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 20px; font-size: 13px; }
  .flow span { padding: 3px 10px; border-radius: 999px; background: #262a32; }
  .flow .hot { background: #4a2a2a; color: #ffb3a8; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  button { background: #2b3040; color: var(--text); border: 1px solid #3c4356; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:hover { background: #343a4d; }
  label { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .opt { background: var(--card); border-radius: 12px; padding: 14px; }
  .opt h2 { font-size: 16px; margin: 0 0 2px; }
  .opt h2 b { color: var(--gold); margin-right: 6px; }
  .opt p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .screen { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; cursor: pointer; background: #23262b; }
  .scene { position: absolute; inset: 0; }
  .scene .floor { position: absolute; inset: 8% 6%; border-radius: 6px; }
  .scene .blk { position: absolute; background: #57524a; border-radius: 2px; box-shadow: 0 3px 0 #3d3a35; }
  .scene .door { position: absolute; width: 7%; height: 18%; border: 3px solid #6b6e75; border-bottom: none; background: rgba(143, 208, 255, 0.55); box-shadow: 0 0 14px rgba(143, 208, 255, 0.8); }
  .scene .me { position: absolute; width: 4.5%; aspect-ratio: 1; border-radius: 50%; background: #6fb3ff; border: 2px solid #dff0ff; transform: translate(-50%, -50%); }
  .scene .foe { position: absolute; width: 3%; aspect-ratio: 1; border-radius: 50%; background: #c9c3b4; transform: translate(-50%, -50%); }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
  .card .lv { font-size: 30px; font-weight: 700; letter-spacing: 2px; color: var(--text); }
  .card .sub { font-size: 13px; color: var(--gold); }
  .freeze { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #ff9d8f; opacity: 0; }
  .timeline { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .timeline i { display: block; }
  .t-cover { background: #556; } .t-hold { background: #a44; } .t-reveal { background: #556; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(9, 1fr); }
  .tiles div { background: #0b0c0f; transform: scale(0) rotate(45deg); }
  .note { margin-top: 28px; max-width: 900px; color: var(--muted); font-size: 13px; }
  .note b { color: var(--text); }
</style>
</head>
<body>
<h1>換小關過場：5 種</h1>
<p class="lead">換關那一下會卡約 0.1~0.2 秒（網頁版 M5 量的 108~178 ms），所以要在畫面<b>完全蓋住</b>的時候才換。每一種都照下面的順序，中間那段順便顯示關卡名。點畫面或按「全部播放」看。</p>
<div class="flow"><span>投票通過</span><span>蓋上</span><span class="hot">換關（畫面卡住的地方）</span><span>顯示「1-3 墓園」</span><span>掀開，回到新地圖的出生點</span></div>
<div class="controls">
  <button id="all">全部播放</button>
  <label><input type="checkbox" id="slow"> 放慢 3 倍</label>
  <label><input type="checkbox" id="showFreeze" checked> 標出卡住的那段</label>
</div>
<div class="grid" id="grid"></div>
<p class="note"><b>共通：</b>蓋上、掀開各約 0.3 秒，中間至少停 0.35 秒（換關＋關卡名），一次過門多約 1 秒。連線時房主在投票通過後先等蓋上的時間才換關，每個人一起播；客戶端收到換關、自己算完地圖才掀開，慢的人黑幕會多停一下。單機一樣照這個流程。</p>
<script>
const OPTIONS = [
  { id: "wipe", name: "往右刷黑幕", desc: "黑色斜邊從左往右刷過去蓋住，換完再繼續往右刷走（同一個方向，像翻頁）。", cover: 300, reveal: 300 },
  { id: "fade", name: "淡出淡入", desc: "最單純：整個畫面變黑再亮回來。不搶戲，但比較沒有「走過門」的感覺。", cover: 280, reveal: 320 },
  { id: "iris", name: "圓圈收到角色身上", desc: "黑幕從四周收成一個圓、縮到自己的角色上，新地圖從出生點的角色往外打開。視線一直在角色上。", cover: 360, reveal: 380 },
  { id: "cubes", name: "方塊斜向翻上來", desc: "畫面被一格格黑色方塊從左上斜向右下翻滿，再照同一個方向翻掉（呼應 Cubeborn 的名字與方塊造型）。", cover: 380, reveal: 380 },
  { id: "door", name: "門光吞沒", desc: "出口門洞的淡藍光從門往外擴散蓋滿畫面、轉暗，新地圖從黑淡入。跟「走進發光的門」最貼。", cover: 360, reveal: 320 },
];
const HOLD = 380;

function sceneHTML(variant) {
  if (variant === 0) {
    return `<div class="scene"><div class="floor" style="background:#2c3530"></div>
      <div class="blk" style="left:18%;top:22%;width:5%;height:9%"></div><div class="blk" style="left:30%;top:58%;width:5%;height:9%"></div>
      <div class="blk" style="left:46%;top:30%;width:14%;height:6%"></div><div class="blk" style="left:62%;top:62%;width:5%;height:9%"></div>
      <div class="door" style="left:84%;top:40%"></div>
      <div class="foe" style="left:40%;top:72%"></div><div class="foe" style="left:55%;top:50%"></div>
      <div class="me" style="left:80%;top:52%"></div></div>`;
  }
  return `<div class="scene"><div class="floor" style="background:#2a2f3a"></div>
    <div class="blk" style="left:12%;top:60%;width:18%;height:6%"></div><div class="blk" style="left:38%;top:20%;width:5%;height:9%"></div>
    <div class="blk" style="left:56%;top:52%;width:5%;height:9%"></div><div class="blk" style="left:70%;top:24%;width:12%;height:6%"></div>
    <div class="foe" style="left:66%;top:70%"></div><div class="foe" style="left:72%;top:66%"></div><div class="foe" style="left:69%;top:74%"></div>
    <div class="me" style="left:22%;top:42%"></div></div>`;
}

const grid = document.getElementById("grid");
const boxes = {};
OPTIONS.forEach((o, i) => {
  const total = o.cover + HOLD + o.reveal;
  const el = document.createElement("div");
  el.className = "opt";
  el.innerHTML = `<h2><b>${String.fromCharCode(65 + i)}</b>${o.name}</h2><p>${o.desc}</p>
    <div class="screen"><div class="stage">${sceneHTML(0)}</div><div class="overlay"></div>
      <div class="card"><div class="lv">1-3</div><div class="sub">墓園 · 基礎難度 4</div></div>
      <div class="freeze">◼ 這段在換關（卡住也看不出來）</div></div>
    <div class="timeline"><i class="t-cover" style="flex:${o.cover}"></i><i class="t-hold" style="flex:${HOLD}"></i><i class="t-reveal" style="flex:${o.reveal}"></i></div>
    <div class="meta"><span>蓋上 ${o.cover} ms</span><span>換關＋關卡名 ≥ ${HOLD} ms</span><span>掀開 ${o.reveal} ms</span></div>`;
  grid.appendChild(el);
  const screen = el.querySelector(".screen");
  boxes[o.id] = { o, screen, stage: el.querySelector(".stage"), overlay: el.querySelector(".overlay"), card: el.querySelector(".card"), freeze: el.querySelector(".freeze"), busy: false };
  screen.addEventListener("click", () => play(o.id));
});

const speed = () => document.getElementById("slow").checked ? 3 : 1;
const wait = (ms) => new Promise((r) => setTimeout(r, ms * speed()));
const anim = (el, frames, ms, easing = "ease-in-out") => el.animate(frames, { duration: ms * speed(), easing, fill: "forwards" }).finished;

// 每一種：cover(b) 蓋滿、reveal(b) 掀開；回傳 Promise
const FX = {
  wipe: {
    setup(b) { b.overlay.innerHTML = `<div style="position:absolute;top:-10%;bottom:-10%;left:-15%;width:130%;background:#0b0c0f;transform:translateX(-120%) skewX(-12deg)"></div>`; },
    cover(b) { return anim(b.overlay.firstChild, [{ transform: "translateX(-120%) skewX(-12deg)" }, { transform: "translateX(0) skewX(-12deg)" }], b.o.cover, "ease-in"); },
    reveal(b) { return anim(b.overlay.firstChild, [{ transform: "translateX(0) skewX(-12deg)" }, { transform: "translateX(120%) skewX(-12deg)" }], b.o.reveal, "ease-out"); },
  },
  fade: {
    setup(b) { b.overlay.innerHTML = `<div style="position:absolute;inset:0;background:#0b0c0f;opacity:0"></div>`; },
    cover(b) { return anim(b.overlay.firstChild, [{ opacity: 0 }, { opacity: 1 }], b.o.cover); },
    reveal(b) { return anim(b.overlay.firstChild, [{ opacity: 1 }, { opacity: 0 }], b.o.reveal); },
  },
  iris: {
    setup(b) { b.overlay.innerHTML = `<div style="position:absolute;inset:0"></div>`; this.at(b, 80, 52, 120); },
    at(b, x, y, r) { b.overlay.firstChild.style.background = `radial-gradient(circle at ${x}% ${y}%, transparent ${r}%, #0b0c0f ${r + 0.6}%)`; },
    tween(b, x, y, r0, r1, ms) {
      return new Promise((done) => {
        const t0 = performance.now(), dur = ms * speed();
        const step = (t) => {
          const k = Math.min(1, (t - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          this.at(b, x, y, r0 + (r1 - r0) * e);
          k < 1 ? requestAnimationFrame(step) : done();
        };
        requestAnimationFrame(step);
      });
    },
    cover(b) { return this.tween(b, 80, 52, 120, 0, b.o.cover); },
    reveal(b) { return this.tween(b, 22, 42, 0, 120, b.o.reveal); },
  },
  cubes: {
    setup(b) {
      let html = "";
      for (let y = 0; y < 9; y++) for (let x = 0; x < 16; x++) html += `<div data-d="${x + y}"></div>`;
      b.overlay.innerHTML = `<div class="tiles">${html}</div>`;
    },
    run(b, from, to, ms) {
      const tiles = [...b.overlay.querySelectorAll(".tiles div")];
      const step = ms / 30;
      return Promise.all(tiles.map((t) => t.animate([{ transform: from }, { transform: to }],
        { duration: ms * 0.4 * speed(), delay: Number(t.dataset.d) * step * 0.6 * speed(), easing: "ease-out", fill: "forwards" }).finished));
    },
    cover(b) { return this.run(b, "scale(0) rotate(45deg)", "scale(1.05) rotate(0deg)", b.o.cover); },
    reveal(b) { return this.run(b, "scale(1.05) rotate(0deg)", "scale(0) rotate(-45deg)", b.o.reveal); },
  },
  door: {
    setup(b) { b.overlay.innerHTML = `<div style="position:absolute;left:87.5%;top:49%;width:10px;height:10px;margin:-5px;border-radius:50%;background:radial-gradient(circle,#dff4ff 0%,#8fd0ff 45%,#3b6a8a 100%);opacity:0"></div><div style="position:absolute;inset:0;background:#0b0c0f;opacity:0"></div>`; },
    async cover(b) {
      const [glow, dark] = b.overlay.children;
      await anim(glow, [{ transform: "scale(1)", opacity: 0.2 }, { transform: "scale(140)", opacity: 1 }], b.o.cover * 0.75, "ease-in");
      await anim(dark, [{ opacity: 0 }, { opacity: 1 }], b.o.cover * 0.25);
    },
    async reveal(b) {
      b.overlay.children[0].style.opacity = 0;
      b.overlay.children[0].getAnimations().forEach((a) => a.cancel());
      await anim(b.overlay.children[1], [{ opacity: 1 }, { opacity: 0 }], b.o.reveal);
    },
  },
};

async function play(id) {
  const b = boxes[id];
  if (b.busy) return;
  b.busy = true;
  b.stage.innerHTML = sceneHTML(0);
  b.card.getAnimations().forEach((a) => a.cancel());
  b.card.style.opacity = 0;
  const fx = FX[id];
  fx.setup(b);
  await wait(250);
  await fx.cover(b);
  // 換關：畫面整個蓋住時才換地圖（遊戲裡這裡會卡 0.1~0.2 秒）
  if (document.getElementById("showFreeze").checked) b.freeze.style.opacity = 1;
  b.stage.innerHTML = sceneHTML(1);
  await anim(b.card, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)" }], 140);
  await wait(HOLD - 140);
  b.freeze.style.opacity = 0;
  const cardOut = anim(b.card, [{ opacity: 1 }, { opacity: 0 }], b.o.reveal * 0.6);
  await Promise.all([fx.reveal(b), cardOut]);
  await wait(200);
  b.busy = false;
}

document.getElementById("all").addEventListener("click", () => OPTIONS.forEach((o) => play(o.id)));
setTimeout(() => OPTIONS.forEach((o) => play(o.id)), 400);
</script>
</body>
</html>
